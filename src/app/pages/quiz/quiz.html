@if (!hasBegin()) {
    <div>
        @if (errorMessage()) {
            <p role="alert">{{ errorMessage() }}</p>
        } @else {
            <app-quiz-details
            [name]="quizInfos()?.name || ''"
            [description]="quizInfos()?.description || ''"
            [kinds]="quizInfos()?.kinds || []"
            [numberOfQuestions]="quizInfos()?.numberOfQuestions || 0">
            </app-quiz-details>
            <button type="button" (click)="beginQuiz()">Commencer le Quiz</button>
        }
    </div>
} @else {
    <app-quiz-question 
    [id]="questions()?.[currentQuestionIndex()].id || 0"
    [question]="questions()?.[currentQuestionIndex()].question || ''"
    [options]="questions()?.[currentQuestionIndex()].options || []"
    [answer]="questions()?.[currentQuestionIndex()].answer || 0"
    (nextQuestion)="goToNextQuestion()"
    (previousQuestion)="goToPreviousQuestion()">
    </app-quiz-question>
    @if (currentQuestionIndex() === (questions()?.length || 0) - 1) {
        <button type="button" (click)="finishQuiz()">Terminer le Quiz</button>
    }
}
