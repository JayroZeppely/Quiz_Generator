
<div>
  <h2>Question {{ id }}</h2>
  <fieldset>
    <legend>{{ question }}</legend>
    @for (option of options; track $index) {
      <div class="option">
        <input
          type="radio"
          name="question-{{ id }}"
          [checked]="selectedOption === $index"
          (change)="selectOption(id - 1, $index)"
        >
        <label>{{ option }}</label>
      </div>
    }
  </fieldset>
</div>
<div>
  <button type="button" id="btn_previous" [disabled]="isPreviousDisabled" (click)="goToPreviousQuestion()">Précédent</button>
  <button type="button" id="btn_next" [disabled]="isNextDisabled" (click)="goToNextQuestion()">Suivant</button>
</div>
